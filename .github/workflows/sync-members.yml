name: Synkronisér Conventus-medlemmer (timesvis)

on:
  schedule:
    - cron: '0 * * * *'   # Hver time

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger synkronisering
        run: |
          # --max-time 30: vi venter kun på at serveren bekræfter modtagelse.
          # PHP kører videre med ignore_user_abort(true) selv om curl afbryder.
          # Exit code 28 (timeout) er forventet og acceptabelt.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://app.sejssvejbaek-if.dk/api/sync-members.php \
            -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}" \
            --max-time 30 || echo "timeout")

          echo "HTTP: $HTTP_CODE"

          # Fejl kun hvis serveren svarer med en reel HTTP-fejl (4xx/5xx)
          if [[ "$HTTP_CODE" =~ ^[45] ]]; then
            echo "Serverfejl: HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Synkronisering igangsat (PHP kører videre på serveren)"
