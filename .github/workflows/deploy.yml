name: Deploy til one.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer dependencies
        run: npm install

      - name: Skriv Firebase service account fra secret
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > public/api/firebase-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Byg app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          CONVENTUS_KEY:                    ${{ secrets.CONVENTUS_KEY }}
          VITE_FIREBASE_VAPID_KEY:          ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Injicér hemmeligheder i .htaccess
        run: |
          sed -i "s|CONVENTUS_KEY_PLACEHOLDER|${{ secrets.CONVENTUS_KEY }}|g"   dist/api/.htaccess
          sed -i "s|SYNC_SECRET_PLACEHOLDER|${{ secrets.SYNC_SECRET }}|g"       dist/api/.htaccess
          sed -i "s|SMTP_PASSWORD_PLACEHOLDER|${{ secrets.SMTP_PASSWORD }}|g"   dist/api/.htaccess
          sed -i "s|SMS_API_KEY_PLACEHOLDER|${{ secrets.SMS_API_KEY }}|g"       dist/api/.htaccess
          sed -i "s|CONVENTUS_KEY_PLACEHOLDER|${{ secrets.CONVENTUS_KEY }}|g"   dist/.htaccess
        env:
          CONVENTUS_KEY: ${{ secrets.CONVENTUS_KEY }}
          SYNC_SECRET:   ${{ secrets.SYNC_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMS_API_KEY:   ${{ secrets.SMS_API_KEY }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./dist/
          server-dir: /customers/7/8/f/sejssvejbaek-if.dk/httpd.www/app/
      # Synkronisering køres IKKE ved deploy — kun via daglig cron (sync-members.yml)
      # eller manuelt fra backoffice. Dette sparer Firestore-kvoten på Spark-planen.
