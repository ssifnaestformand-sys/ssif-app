name: Daglig Conventus-synkronisering

on:
  schedule:
    - cron: '0 4 * * *'   # Kl. 04:00 UTC hver nat

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Synkronisér hold og afdelinger
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://app.sejssvejbaek-if.dk/api/sync-holds.php \
            -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}" \
            --max-time 120 || echo "timeout")
          echo "sync-holds HTTP: $HTTP"
          [[ "$HTTP" =~ ^[45] ]] && echo "Hold-sync fejlede" && exit 1 || true

      - name: Synkronisér medlemmer
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://app.sejssvejbaek-if.dk/api/sync-members.php \
            -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}" \
            --max-time 30 || echo "timeout")
          echo "sync-members HTTP: $HTTP"
          [[ "$HTTP" =~ ^[45] ]] && echo "Member-sync fejlede" && exit 1 || true
