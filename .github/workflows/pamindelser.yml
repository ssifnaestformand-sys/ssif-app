name: Send automatiske påmindelser

on:
  schedule:
    - cron: '0 * * * *'   # Kører hvert time
  workflow_dispatch:        # Tillader manuel kørsel fra GitHub-UI

jobs:
  pamind:
    runs-on: ubuntu-latest
    steps:
      - name: Send påmindelser
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}" \
            --connect-timeout 30 \
            --max-time 300 \
            https://app.sejssvejbaek-if.dk/api/send-pamindelser.php || echo "timeout")
          echo "send-pamindelser HTTP: $HTTP"
          [[ "$HTTP" =~ ^[45] ]] && echo "Påmindelses-afsendelse fejlede (HTTP $HTTP)" && exit 1 || true
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
